name: Build Vitakora 3 Preview
on:
  push:
    paths:
      - 'preview/vitakora3_preview.py'
      - '.github/workflows/build-vitakora3.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile preview/vitakora3_preview.py
      - name: Build Vitakora.exe
        run: |
          python -m pip install pyinstaller
          python -m PyInstaller --clean --onefile --windowed --name Vitakora preview/vitakora3_preview.py
      - name: Create installer script
        shell: powershell
        run: |
          @'
          [Setup]
          AppName=Vitakora
          AppVersion=3.0 Preview
          DefaultDirName={autopf}\Vitakora
          DefaultGroupName=Vitakora
          OutputDir=output
          OutputBaseFilename=Vitakora-Setup-3.0-Preview
          Compression=lzma2
          SolidCompression=yes
          PrivilegesRequired=admin
          [Files]
          Source: "..\dist\Vitakora.exe"; DestDir: "{app}"; Flags: ignoreversion
          [Icons]
          Name: "{group}\Vitakora"; Filename: "{app}\Vitakora.exe"
          Name: "{autodesktop}\Vitakora"; Filename: "{app}\Vitakora.exe"
          Name: "{userstartup}\Vitakora"; Filename: "{app}\Vitakora.exe"
          [Run]
          Filename: "{app}\Vitakora.exe"; Description: "Abrir Vitakora"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content preview\Vitakora.iss
      - name: Build installer
        shell: powershell
        working-directory: preview
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" Vitakora.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: Vitakora-Setup-3.0-Preview
          path: preview/output/Vitakora-Setup-3.0-Preview.exe
