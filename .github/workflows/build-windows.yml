name: Build Vitakora Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source package
        shell: pwsh
        run: |
          $parts = Get-ChildItem build/source.part*.b64 | Sort-Object Name
          $base64 = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\vitakora-source.zip", [Convert]::FromBase64String($base64))
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE\source" | Out-Null
          Expand-Archive "$env:RUNNER_TEMP\vitakora-source.zip" "$env:GITHUB_WORKSPACE\source" -Force

      - name: Convert test build to standalone SQLite
        shell: pwsh
        run: |
          $props = "$env:GITHUB_WORKSPACE\source\Directory.Packages.props"
          $propsText = Get-Content $props -Raw
          if ($propsText -notmatch 'Microsoft.EntityFrameworkCore.Sqlite') {
            $propsText = $propsText.Replace(
              '<PackageVersion Include="Microsoft.EntityFrameworkCore.Design" Version="10.0.12" />',
              '<PackageVersion Include="Microsoft.EntityFrameworkCore.Design" Version="10.0.12" />' + [Environment]::NewLine + '    <PackageVersion Include="Microsoft.EntityFrameworkCore.Sqlite" Version="10.0.12" />'
            )
            Set-Content $props $propsText -NoNewline
          }

          $serverProj = "$env:GITHUB_WORKSPACE\source\src\Vitakora.Server\Vitakora.Server.csproj"
          $serverProjText = Get-Content $serverProj -Raw
          $serverProjText = $serverProjText.Replace('<Project Sdk="Microsoft.NET.Sdk.Web">', '<Project Sdk="Microsoft.NET.Sdk.Web">' + [Environment]::NewLine + '  <PropertyGroup><OutputType>WinExe</OutputType></PropertyGroup>')
          $serverProjText = $serverProjText.Replace('<PackageReference Include="Npgsql.EntityFrameworkCore.PostgreSQL" />', '<PackageReference Include="Microsoft.EntityFrameworkCore.Sqlite" />')
          Set-Content $serverProj $serverProjText -NoNewline

          $api = "$env:GITHUB_WORKSPACE\source\src\Vitakora.Client\Services\ApiClient.cs"
          $apiText = Get-Content $api -Raw
          if ($apiText -notmatch 'using System.Net.Http;') {
            Set-Content $api ("using System.Net.Http;" + [Environment]::NewLine + $apiText) -NoNewline
          }

          $mainWindow = "$env:GITHUB_WORKSPACE\source\src\Vitakora.Client\MainWindow.xaml.cs"
          @'
          using System.IO;
          using System.Windows;
          using System.Windows.Controls;
          using Vitakora.Client.Services;
          using Vitakora.Shared;

          namespace Vitakora.Client;

          public partial class MainWindow : Window
          {
              readonly ChatConnection _chat = new();
              ApiClient? _api;
              LoginResponse? _login;
              string _serverUrl = "http://localhost:5000";
              string ConfigFile => Path.Combine(
                  Environment.GetFolderPath(Environment.SpecialFolder.CommonApplicationData),
                  "Vitakora", "server.txt");

              public MainWindow()
              {
                  InitializeComponent();
                  PresenceBox.ItemsSource = Enum.GetValues<PresenceStatus>();
                  PresenceBox.SelectedItem = PresenceStatus.Available;

                  try
                  {
                      Directory.CreateDirectory(Path.GetDirectoryName(ConfigFile)!);
                      if (File.Exists(ConfigFile))
                      {
                          var saved = File.ReadAllText(ConfigFile).Trim();
                          if (!string.IsNullOrWhiteSpace(saved)) _serverUrl = NormalizeServer(saved);
                      }
                  }
                  catch { }

                  ServerBox.Text = _serverUrl;
                  Loaded += async (_, _) => await LoadServerAsync();

                  _chat.MessageReceived += m => Dispatcher.Invoke(async () =>
                  {
                      MessagesList.Items.Add($"{m.SenderName}: {m.Text}");
                      await _chat.MarkDeliveredAsync(m.Id);
                      if (IsActive) await _chat.MarkReadAsync(m.Id);
                      ShowPopup(m);
                  });

                  _chat.SessionRevoked += reason => Dispatcher.Invoke(() =>
                  {
                      StatusText.Text = reason;
                      _login = null;
                      RecipientBox.ItemsSource = null;
                  });
              }

              static string NormalizeServer(string value)
              {
                  value = value.Trim().TrimEnd('/');
                  if (!value.StartsWith("http://", StringComparison.OrdinalIgnoreCase) &&
                      !value.StartsWith("https://", StringComparison.OrdinalIgnoreCase))
                      value = "http://" + value;
                  if (!Uri.TryCreate(value, UriKind.Absolute, out var uri))
                      throw new InvalidOperationException("Dirección de servidor no válida.");
                  if (uri.IsDefaultPort) value = value + ":5000";
                  return value;
              }

              async Task LoadServerAsync()
              {
                  try
                  {
                      _serverUrl = NormalizeServer(ServerBox.Text);
                      ServerBox.Text = _serverUrl;
                      File.WriteAllText(ConfigFile, _serverUrl);
                      _api = new ApiClient(_serverUrl);
                      StatusText.Text = "Conectando con el servidor...";
                      WorkstationBox.ItemsSource = await _api.GetWorkstationsAsync();
                      WorkstationBox.SelectedIndex = 0;
                      StatusText.Text = "Servidor disponible.";
                  }
                  catch (Exception ex)
                  {
                      WorkstationBox.ItemsSource = null;
                      StatusText.Text = $"Servidor no disponible: {ex.Message}";
                  }
              }

              async void Server_Click(object s, RoutedEventArgs e) => await LoadServerAsync();

              async void Login_Click(object s, RoutedEventArgs e)
              {
                  if (_api is null)
                  {
                      await LoadServerAsync();
                      if (_api is null) return;
                  }
                  if (WorkstationBox.SelectedItem is not WorkstationDto ws) return;
                  try
                  {
                      _login = await _api.LoginAsync(new LoginRequest(UsernameBox.Text, PasswordBox.Password, ws.Id));
                      if (_login is null)
                      {
                          StatusText.Text = "Credenciales no válidas.";
                          return;
                      }
                      await _chat.ConnectAsync(_serverUrl, _login.AccessToken);
                      RecipientBox.ItemsSource = await _api.GetDirectoryAsync(_login.AccessToken);
                      RecipientBox.SelectedIndex = 0;
                      StatusText.Text = $"Conectado como {_login.DisplayName}";
                  }
                  catch (Exception ex)
                  {
                      StatusText.Text = ex.Message;
                  }
              }

              async void Send_Click(object s, RoutedEventArgs e)
              {
                  if (_login is null || RecipientBox.SelectedItem is not DirectoryItemDto target ||
                      string.IsNullOrWhiteSpace(MessageBox.Text)) return;
                  var text = MessageBox.Text.Trim();
                  await _chat.SendAsync(new SendMessageRequest(target.Kind, target.Id, text));
                  MessagesList.Items.Add($"Yo → {target.Name}: {text}");
                  MessageBox.Clear();
              }

              async void PresenceBox_SelectionChanged(object s, SelectionChangedEventArgs e)
              {
                  if (_login is not null && PresenceBox.SelectedItem is PresenceStatus p)
                      await _chat.SetPresenceAsync(p);
              }

              void ShowPopup(MessageDto m)
              {
                  var p = new PopupWindow(m.SenderName, m.Text);
                  p.ReplyRequested += async text =>
                      await _chat.SendAsync(new SendMessageRequest(RecipientKind.User, m.SenderUserId, text));
                  p.Show();
              }
          }
          '@ | Set-Content $mainWindow -NoNewline

          $mainXaml = "$env:GITHUB_WORKSPACE\source\src\Vitakora.Client\MainWindow.xaml"
          @'
          <Window x:Class="Vitakora.Client.MainWindow" xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation" xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml" Title="Vitakora" Width="980" Height="680" MinWidth="760" MinHeight="520" WindowStartupLocation="CenterScreen" Background="{StaticResource Background}">
          <Grid><Grid.ColumnDefinitions><ColumnDefinition Width="280"/><ColumnDefinition Width="*"/></Grid.ColumnDefinitions>
          <Border Background="#202123" Padding="18"><StackPanel>
          <TextBlock Text="Vitakora" Foreground="White" FontSize="26" FontWeight="SemiBold" Margin="0,0,0,22"/>
          <TextBlock Text="Servidor" Foreground="#B8B8BD"/>
          <DockPanel Margin="0,6,0,12"><Button DockPanel.Dock="Right" Content="Conectar" Width="78" Margin="6,0,0,0" Click="Server_Click"/><TextBox x:Name="ServerBox" Height="34" VerticalContentAlignment="Center"/></DockPanel>
          <TextBlock Text="Usuario" Foreground="#B8B8BD"/><TextBox x:Name="UsernameBox" Margin="0,6,0,12" Height="34"/>
          <TextBlock Text="Contraseña" Foreground="#B8B8BD"/><PasswordBox x:Name="PasswordBox" Margin="0,6,0,12" Height="34"/>
          <TextBlock Text="Puesto" Foreground="#B8B8BD"/><ComboBox x:Name="WorkstationBox" DisplayMemberPath="Name" Margin="0,6,0,12" Height="34"/>
          <Button Content="Entrar" Height="38" Click="Login_Click"/>
          <TextBlock x:Name="StatusText" Foreground="#D9D9E3" TextWrapping="Wrap" Margin="0,16,0,0"/>
          </StackPanel></Border>
          <Grid Grid.Column="1" Margin="24"><Grid.RowDefinitions><RowDefinition Height="Auto"/><RowDefinition Height="*"/><RowDefinition Height="Auto"/></Grid.RowDefinitions>
          <DockPanel Margin="0,0,0,14"><TextBlock Text="Chat" FontSize="24" FontWeight="SemiBold"/><ComboBox x:Name="PresenceBox" Width="160" HorizontalAlignment="Right" DockPanel.Dock="Right" SelectionChanged="PresenceBox_SelectionChanged"/></DockPanel>
          <ListBox x:Name="MessagesList" Grid.Row="1" BorderThickness="0" Background="Transparent"/>
          <Grid Grid.Row="2" Margin="0,14,0,0"><Grid.ColumnDefinitions><ColumnDefinition Width="210"/><ColumnDefinition Width="*"/><ColumnDefinition Width="90"/></Grid.ColumnDefinitions>
          <ComboBox x:Name="RecipientBox" DisplayMemberPath="Name"/><TextBox x:Name="MessageBox" Grid.Column="1" Margin="8,0" Height="42" VerticalContentAlignment="Center"/><Button Grid.Column="2" Content="Enviar" Click="Send_Click"/>
          </Grid></Grid></Grid></Window>
          '@ | Set-Content $mainXaml -NoNewline

          $program = "$env:GITHUB_WORKSPACE\source\src\Vitakora.Server\Program.cs"
          @'
          using System.Text;
          using Microsoft.AspNetCore.Authentication.JwtBearer;
          using Microsoft.AspNetCore.Identity;
          using Microsoft.AspNetCore.SignalR;
          using Microsoft.EntityFrameworkCore;
          using Microsoft.IdentityModel.Tokens;
          using Vitakora.Server.Data;
          using Vitakora.Server.Hubs;
          using Vitakora.Server.Options;
          using Vitakora.Server.Services;
          using Vitakora.Shared;

          Directory.SetCurrentDirectory(AppContext.BaseDirectory);

          var builder = WebApplication.CreateBuilder(args);
          builder.WebHost.UseUrls("http://0.0.0.0:5000");

          builder.Services.Configure<VitakoraOptions>(builder.Configuration.GetSection("Vitakora"));
          builder.Services.Configure<JwtOptions>(builder.Configuration.GetSection("Jwt"));

          var dataDir = Path.Combine(
              Environment.GetFolderPath(Environment.SpecialFolder.CommonApplicationData),
              "Vitakora");
          Directory.CreateDirectory(dataDir);
          var dbPath = Path.Combine(dataDir, "vitakora.db");

          builder.Services.AddDbContext<VitakoraDbContext>(o => o.UseSqlite($"Data Source={dbPath}"));
          builder.Services.AddSignalR(o => o.AddFilter<SessionHubFilter>());
          builder.Services.AddScoped<SessionHubFilter>();
          builder.Services.AddScoped<AuthService>();
          builder.Services.AddSingleton<TokenService>();
          builder.Services.AddSingleton<ConnectionRegistry>();

          var jwt = builder.Configuration.GetSection("Jwt").Get<JwtOptions>()!;
          builder.Services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)
              .AddJwtBearer(o =>
              {
                  o.TokenValidationParameters = new TokenValidationParameters
                  {
                      ValidateIssuer = true,
                      ValidIssuer = jwt.Issuer,
                      ValidateAudience = true,
                      ValidAudience = jwt.Audience,
                      ValidateIssuerSigningKey = true,
                      IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(jwt.Key)),
                      ValidateLifetime = true,
                      ClockSkew = TimeSpan.FromSeconds(30)
                  };
                  o.Events = new JwtBearerEvents
                  {
                      OnMessageReceived = ctx =>
                      {
                          var token = ctx.Request.Query["access_token"];
                          if (!string.IsNullOrEmpty(token) &&
                              ctx.HttpContext.Request.Path.StartsWithSegments("/hubs/chat"))
                              ctx.Token = token;
                          return Task.CompletedTask;
                      }
                  };
              });

          builder.Services.AddAuthorization();

          var app = builder.Build();
          app.UseAuthentication();
          app.UseMiddleware<SessionValidationMiddleware>();
          app.UseAuthorization();

          app.MapGet("/health", () => Results.Ok(new
          {
              status = "ok",
              product = "Vitakora",
              database = dbPath,
              utc = DateTimeOffset.UtcNow
          }));

          app.MapGet("/api/workstations", async (VitakoraDbContext db) =>
              await db.Workstations.Where(x => x.IsActive).OrderBy(x => x.Name)
                  .Select(x => new WorkstationDto(x.Id, x.Name)).ToListAsync());

          app.MapPost("/api/auth/login", async (LoginRequest req, AuthService auth, CancellationToken ct) =>
          {
              var r = await auth.LoginAsync(req, ct);
              return r is null ? Results.Unauthorized() : Results.Ok(r);
          });

          app.MapGet("/api/directory", async (VitakoraDbContext db) =>
          {
              var users = await db.Users.Where(x => x.IsActive)
                  .Select(x => new DirectoryItemDto(x.Id, x.DisplayName, RecipientKind.User)).ToListAsync();
              var workstations = await db.Workstations.Where(x => x.IsActive)
                  .Select(x => new DirectoryItemDto(x.Id, x.Name, RecipientKind.Workstation)).ToListAsync();
              var groups = await db.Groups.Where(x => x.IsActive)
                  .Select(x => new DirectoryItemDto(x.Id, x.Name, RecipientKind.Group)).ToListAsync();
              return users.Concat(workstations).Concat(groups).OrderBy(x => x.Kind).ThenBy(x => x.Name);
          }).RequireAuthorization();

          app.MapHub<ChatHub>("/hubs/chat");

          await SeedAsync(app.Services);
          app.Run();

          static async Task SeedAsync(IServiceProvider sp)
          {
              using var scope = sp.CreateScope();
              var db = scope.ServiceProvider.GetRequiredService<VitakoraDbContext>();
              await db.Database.EnsureCreatedAsync();

              if (!await db.Workstations.AnyAsync())
                  db.Workstations.Add(new Workstation { Name = "PUESTO-01" });

              if (!await db.Users.AnyAsync())
              {
                  var user = new AppUser
                  {
                      Username = "master",
                      DisplayName = "Master Vitakora",
                      Role = UserRole.Master
                  };
                  user.PasswordHash = new PasswordHasher<AppUser>()
                      .HashPassword(user, "Vitakora2026!");
                  db.Users.Add(user);
              }

              await db.SaveChangesAsync();
          }
          '@ | Set-Content $program -NoNewline

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        working-directory: source
        run: dotnet restore Vitakora.slnx

      - name: Build
        working-directory: source
        run: dotnet build Vitakora.slnx -c Release --no-restore

      - name: Publish Windows client
        shell: pwsh
        working-directory: source
        run: |
          dotnet publish src/Vitakora.Client/Vitakora.Client.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ../out/client

      - name: Publish Windows server
        shell: pwsh
        working-directory: source
        run: |
          dotnet publish src/Vitakora.Server/Vitakora.Server.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -o ../out/server

      - name: Build installers
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          New-Item -ItemType Directory -Force installer | Out-Null

          @'
          [Setup]
          AppId={{4F48A2E6-EC23-4B54-B1E2-90F7C174E858}
          AppName=Vitakora Servidor
          AppVersion=0.2.0
          AppPublisher=Viteka
          DefaultDirName={autopf}\Vitakora
          DefaultGroupName=Vitakora
          OutputDir=..\out
          OutputBaseFilename=Vitakora-Servidor-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Dirs]
          Name: "{commonappdata}\Vitakora"; Permissions: users-modify

          [Files]
          Source: "..\out\server\*"; DestDir: "{app}\Server"; Flags: ignoreversion recursesubdirs createallsubdirs
          Source: "..\out\client\*"; DestDir: "{app}\Client"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autodesktop}\Vitakora"; Filename: "{app}\Client\Vitakora.Client.exe"
          Name: "{group}\Vitakora"; Filename: "{app}\Client\Vitakora.Client.exe"

          [Run]
          Filename: "{cmd}"; Parameters: "/C echo http://localhost:5000>""{commonappdata}\Vitakora\server.txt"""; Flags: runhidden waituntilterminated
          Filename: "{cmd}"; Parameters: "/C netsh advfirewall firewall delete rule name=""Vitakora Server"" >nul 2>&1 & netsh advfirewall firewall add rule name=""Vitakora Server"" dir=in action=allow protocol=TCP localport=5000"; Flags: runhidden waituntilterminated
          Filename: "{cmd}"; Parameters: "/C schtasks /Delete /TN ""Vitakora Server"" /F >nul 2>&1"; Flags: runhidden waituntilterminated
          Filename: "{cmd}"; Parameters: "/C schtasks /Create /TN ""Vitakora Server"" /TR """"""{app}\Server\Vitakora.Server.exe"""""" /SC ONSTART /RU SYSTEM /RL HIGHEST /F"; Flags: runhidden waituntilterminated
          Filename: "{cmd}"; Parameters: "/C schtasks /Run /TN ""Vitakora Server"""; Flags: runhidden waituntilterminated
          Filename: "{app}\Client\Vitakora.Client.exe"; Description: "Abrir Vitakora"; Flags: nowait postinstall skipifsilent

          [UninstallRun]
          Filename: "{cmd}"; Parameters: "/C schtasks /End /TN ""Vitakora Server"" >nul 2>&1 & schtasks /Delete /TN ""Vitakora Server"" /F >nul 2>&1 & netsh advfirewall firewall delete rule name=""Vitakora Server"" >nul 2>&1"; Flags: runhidden waituntilterminated
          '@ | Set-Content installer\Server.iss -NoNewline

          @'
          [Setup]
          AppId={{9259584C-6413-44CD-806C-7132E59BB1B6}
          AppName=Vitakora Cliente
          AppVersion=0.2.0
          AppPublisher=Viteka
          DefaultDirName={autopf}\Vitakora Cliente
          DefaultGroupName=Vitakora
          OutputDir=..\out
          OutputBaseFilename=Vitakora-Cliente-Setup
          Compression=lzma2
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesAllowed=x64compatible
          ArchitecturesInstallIn64BitMode=x64compatible

          [Dirs]
          Name: "{commonappdata}\Vitakora"; Permissions: users-modify

          [Files]
          Source: "..\out\client\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{autodesktop}\Vitakora"; Filename: "{app}\Vitakora.Client.exe"
          Name: "{group}\Vitakora"; Filename: "{app}\Vitakora.Client.exe"

          [Run]
          Filename: "{app}\Vitakora.Client.exe"; Description: "Abrir Vitakora"; Flags: nowait postinstall skipifsilent
          '@ | Set-Content installer\Client.iss -NoNewline

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Server.iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\Client.iss

      - name: Package portable builds
        shell: pwsh
        run: |
          Compress-Archive -Path out/client/* -DestinationPath out/Vitakora-Client-win-x64.zip -Force
          Compress-Archive -Path out/server/* -DestinationPath out/Vitakora-Server-win-x64.zip -Force

      - name: Upload server installer
        uses: actions/upload-artifact@v4
        with:
          name: Vitakora-Servidor-Setup
          path: out/Vitakora-Servidor-Setup.exe
          if-no-files-found: error

      - name: Upload client installer
        uses: actions/upload-artifact@v4
        with:
          name: Vitakora-Cliente-Setup
          path: out/Vitakora-Cliente-Setup.exe
          if-no-files-found: error

      - name: Upload portable builds
        uses: actions/upload-artifact@v4
        with:
          name: Vitakora-Portable
          path: |
            out/Vitakora-Client-win-x64.zip
            out/Vitakora-Server-win-x64.zip
          if-no-files-found: error
