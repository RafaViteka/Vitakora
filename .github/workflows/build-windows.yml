name: Build Vitakora Windows

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path source | Out-Null
          Expand-Archive build/source.zip source -Force

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build Vitakora
        shell: pwsh
        working-directory: source
        run: .\build-windows.ps1

      - name: Upload server installer
        uses: actions/upload-artifact@v4
        with:
          name: Vitakora-Servidor-Setup
          path: source/out/Vitakora-Servidor-Setup.exe
          if-no-files-found: error

      - name: Upload client installer
        uses: actions/upload-artifact@v4
        with:
          name: Vitakora-Cliente-Setup
          path: source/out/Vitakora-Cliente-Setup.exe
          if-no-files-found: error
